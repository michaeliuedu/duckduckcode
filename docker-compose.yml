name: duckduckcode

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: duck
      POSTGRES_PASSWORD: duck
      POSTGRES_DB: duckduckcode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duck -d duckduckcode"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      args:
        VERSION: local
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://duck:duck@postgres:5432/duckduckcode?sslmode=disable
      MIGRATE_ON_START: "true"
      # Browser origins allowed to call the API / open WebSockets. 3000 is the
      # frontend container; 5173 is `npm run dev`, which proxies /api and /ws and
      # so needs no CORS, but is listed for anyone hitting the backend directly.
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      SNAPSHOT_EVERY: "200"
      # Local and CI only. Every request here comes from the Docker bridge, so
      # the whole end-to-end suite looks like one very busy address; the
      # production defaults (30/hour) would throttle it. Deployments do not set
      # these, and keep the defaults in internal/config.
      SIGNUPS_PER_IP: "2000"
      LOGIN_ATTEMPTS_PER_IP: "2000"
      LOG_FORMAT: text
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # distroless has no shell/curl; the ECS deployment uses the ALB health
      # check instead. Locally we rely on `docker compose ps` + /healthz.
      disable: true

  # Static bundle served by nginx. BACKEND_PUBLIC_URL is written into
  # /runtime-config.js at container start, so this image is the same one that runs
  # on AWS (where the value is empty and the ALB routes /api and /ws).
  frontend:
    build:
      context: ./frontend
    environment:
      # URL the *browser* uses to reach the backend. Empty = same origin.
      BACKEND_PUBLIC_URL: http://localhost:8080
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # One-off integration test runner: `docker compose --profile test run --rm backend-test`
  backend-test:
    profiles: ["test"]
    image: golang:1.24-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    environment:
      TEST_DATABASE_URL: postgres://duck:duck@postgres:5432/duckduckcode_test?sslmode=disable
      CGO_ENABLED: "0"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-test-db:
        condition: service_completed_successfully
    command: ["go", "test", "./...", "-count=1", "-v"]

  # Creates the separate test database (idempotent).
  postgres-test-db:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      PGPASSWORD: duck
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - >
        psql -h postgres -U duck -d duckduckcode -tc "SELECT 1 FROM pg_database WHERE datname = 'duckduckcode_test'" | grep -q 1
        || psql -h postgres -U duck -d duckduckcode -c "CREATE DATABASE duckduckcode_test"

volumes:
  pgdata:
  gomodcache:
  gobuildcache:
